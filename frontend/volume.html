<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Hub 音量</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: system-ui, "Microsoft YaHei", sans-serif;
            user-select: none;
        }
        .volume-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px 16px 16px;
        }
        .vp-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .vp-device {
            min-width: 0;
            overflow: hidden;
            color: var(--text-muted);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .vp-slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .vp-slider {
            flex: 1;
            min-width: 0;
            accent-color: var(--accent);
        }
        .vp-pct {
            width: 42px;
            color: var(--text-secondary);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }
        .vp-status {
            min-height: 14px;
            color: var(--danger);
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="volume-panel">
        <div class="vp-header">
            <span id="vp-device" class="vp-device">读取中…</span>
            <button id="vp-mute" class="btn btn-sm" type="button">静音</button>
        </div>
        <div class="vp-slider-row">
            <input id="vp-slider" class="vp-slider" type="range" min="0" max="100" value="0">
            <span id="vp-pct" class="vp-pct">0%</span>
        </div>
        <p id="vp-status" class="vp-status"></p>
    </div>
    <script src="js/api.js"></script>
    <script src="js/volume.js"></script>
</body>
</html>
