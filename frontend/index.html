<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部栏 -->
    <header class="topbar">
        <h1 class="logo">🎧 Audio Hub</h1>
        <div class="topbar-actions">
            <button id="about-btn" class="btn btn-icon" title="关于">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
            </button>
            <button id="theme-toggle-btn" class="btn btn-icon" title="切换浅色/暗色模式">
                <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <span class="topbar-sep"></span>
            <button id="minimize-btn" class="btn btn-icon win-ctrl" title="最小化">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button id="maximize-btn" class="btn btn-icon win-ctrl" title="最大化">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16"/></svg>
            </button>
            <button id="close-btn" class="btn btn-icon win-ctrl win-close" title="关闭">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </header>

    <!-- 设备抽屉（从右侧滑入） -->
    <div id="device-drawer" class="device-drawer hidden">
        <div class="drawer-header">
            <h2>音频设备</h2>
            <button id="drawer-close-btn" class="btn btn-icon" title="关闭">✕</button>
        </div>
        <div class="drawer-body" id="device-list">
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
        </div>
    </div>
    <div id="drawer-overlay" class="drawer-overlay hidden"></div>

    <!-- 错误横幅 -->
    <div id="error-banner" class="error-banner hidden">
        <span>⚠️ 加载失败</span>
        <span id="error-msg"></span>
        <button class="btn btn-sm" onclick="location.reload()">重试</button>
    </div>

    <!-- 主内容：应用音量 -->
    <main class="dashboard">
        <section class="card session-card">
            <div class="card-header">
                <span class="card-icon">🎚️</span>
                <h2>应用音量</h2>
                <span class="session-count-badge" id="session-count">—</span>
                <div class="header-actions">
                    <button id="global-eq-btn" class="btn plugin-entry-btn" title="通过 Equalizer APO 调节输出 EQ 与麦克风处理">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="4" y1="7" x2="20" y2="7"/>
                            <line x1="4" y1="17" x2="20" y2="17"/>
                            <circle cx="9" cy="7" r="2"/>
                            <circle cx="15" cy="17" r="2"/>
                        </svg>
                        <span>Equalizer APO</span>
                    </button>
                    <span class="toolbar-divider"></span>
                    <div class="profile-toolbar" id="profile-toolbar">
                        <span class="scene-label">场景</span>
                        <select id="profile-select" class="profile-select" title="选择场景">
                        </select>
                        <button id="profile-new-btn" class="btn toolbar-icon-btn"
                            title="新建场景" aria-label="新建场景">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                        </button>
                        <button id="profile-delete-btn" class="btn toolbar-icon-btn danger"
                            title="删除选中场景" aria-label="删除选中场景">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                <path d="M10 11v6"/><path d="M14 11v6"/>
                                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                            </svg>
                        </button>
                    </div>
                    <span class="badge hidden-badge" id="hidden-badge" title="点击显示/隐藏">👁️ 隐藏 0</span>
                </div>
            </div>
            <div class="card-body" id="session-list">
                <div class="skeleton skeleton-row"></div>
                <div class="skeleton skeleton-row"></div>
                <div class="skeleton skeleton-row"></div>
            </div>
        </section>
    </main>

    <!-- 底部状态栏：默认设备 -->
    <footer class="statusbar">
        <div class="statusbar-left" id="statusbar-output" title="点击查看所有设备">
            <span class="status-icon">🔊</span>
            <span class="status-label">输出</span>
            <span class="status-name" id="statusbar-output-name"></span>
        </div>
        <div class="statusbar-center">
            <span id="status-text">就绪</span>
        </div>
        <div class="statusbar-right" id="statusbar-input" title="点击查看所有设备">
            <span class="status-icon">🎙️</span>
            <span class="status-label">输入</span>
            <span class="status-name" id="statusbar-input-name"></span>
        </div>
    </footer>

    <!-- About 弹窗 -->
    <div id="about-modal" class="about-modal hidden">
        <div class="about-card">
            <h2>🎧 Audio Hub</h2>
            <p class="about-ver">v0.2</p>
            <p class="about-desc">游戏玩家的音频控制中心</p>
            <div class="about-tech">
                <span>Rust</span><span>Tauri 2</span><span>WASAPI</span>
            </div>
            <p class="about-author">开发者：Juice & Claude</p>
            <label class="about-autostart-row">
                <span>
                    <strong>开机自启动</strong>
                    <small>登录 Windows 后自动打开 Audio Hub</small>
                </span>
                <span class="toggle-switch">
                    <input id="about-autostart" type="checkbox">
                    <span class="toggle-switch-track"></span>
                </span>
            </label>
            <p id="about-autostart-status" class="about-option-status"></p>
            <button id="about-close-btn" class="btn btn-sm">关闭</button>
        </div>
    </div>

    <!-- Equalizer APO 插件 -->
    <div id="global-eq-modal" class="global-eq-modal hidden">
        <div class="global-eq-card">
            <div class="eq-header">
                <div class="eq-title-row">
                    <h2>Equalizer APO 插件</h2>
                    <span class="eq-help header-help" tabindex="0" role="note"
                        aria-label="Equalizer APO 插件使用说明"
                        data-tooltip="输出 EQ 与麦克风处理相互独立，并按设备保存。选择音色预设后会立即切换；调整参数后才需要保存。断开 Equalizer APO 会同时停止 Audio Hub 的输出 EQ 和麦克风处理，但不会卸载插件或删除参数。">?</span>
                </div>
                <button id="global-eq-close-btn" class="btn btn-icon" title="关闭">✕</button>
            </div>
            <div id="global-eq-content"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
